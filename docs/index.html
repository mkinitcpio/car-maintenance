      &middot; <span data-i18n="license"></span>
    </p>
  </footer>

  <script>
    var I18N = {
      en: {
        tagline: 'Desktop app for tracking your car parts maintenance: engine, oil, and anything you want. Manage cost, date, and mileage.',
        download: 'Download',
        feature1Title: 'Any part, any category',
        feature1Text: 'Engine, oil changes, filters — or create your own categories and parts.',
        feature2Title: 'Cost, date & mileage',
        feature2Text: 'Every record tracks what was done, when, at what mileage, and for how much.',
        feature3Title: 'Local-first',
        feature3Text: 'Your data lives in a plain JSON file on your disk. No cloud, no accounts, no tracking.',
        availableOn: 'Available on',
        formatSnap: 'Snap package',
        releases: 'Releases',
        license: 'MIT License'
      },
      ru: {
        tagline: 'Десктопное приложение для учёта обслуживания вашего авто: двигатель, масло и всё, что захотите. Стоимость, дата и пробег.',
        download: 'Скачать',
        feature1Title: 'Любая деталь, любая категория',
        feature1Text: 'Двигатель, замены масла, фильтры — или создайте собственные категории и детали.',
        feature2Title: 'Стоимость, дата и пробег',
        feature2Text: 'Каждая запись хранит: что сделано, когда, на каком пробеге и за сколько.',
        feature3Title: 'Данные у вас',
        feature3Text: 'Всё хранится в обычном JSON-файле на вашем диске. Без облака, без аккаунтов, без слежки.',
        availableOn: 'Доступно на',
        formatSnap: 'Пакет Snap',
        releases: 'Релизы',
        license: 'Лицензия MIT'
      }
    };

    var STORAGE_KEY = 'lang';
    var buttons = document.querySelectorAll('.lang-toggle button');

    function applyLang(lang) {
      var dict = I18N[lang] || I18N.en;
      document.documentElement.setAttribute('lang', lang);
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (dict[key] !== undefined) {
          el.textContent = dict[key];
        }
      });
      buttons.forEach(function (btn) {
        btn.setAttribute('aria-pressed', String(btn.getAttribute('data-lang') === lang));
      });
    }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var lang = btn.getAttribute('data-lang');
        localStorage.setItem(STORAGE_KEY, lang);
        applyLang(lang);
      });
    });

    var saved = localStorage.getItem(STORAGE_KEY);
    var initial = saved || (navigator.language && navigator.language.indexOf('ru') === 0 ? 'ru' : 'en');
    applyLang(initial);
  </script>
</body>
</html>
