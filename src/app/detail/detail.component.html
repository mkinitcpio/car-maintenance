<app-details [title]="name">
  <ng-container buttons-left>
    <button cm-button variant="neutral" shape="rounded" (click)="navigateToParentGroup(parentId)">
      <mat-icon svgIcon="tree"></mat-icon>
    </button>
  </ng-container>

  <ng-container content>
    <cm-widgets-panel [data]="widgets()"></cm-widgets-panel>
    <cm-table [config]="tableConfig"
              [rows]="dataSourceTable"
              (add)="onCreate()"
              (edit)="onEdit($event)"
              (exportToPDF)="onExportToPDF()"
              (delete)="onDelete($event)"
              (move)="onMove($event)"
              (exportToCSV)="onExportCSV($event)"
              (columnVisibilityChange)="onColumnVisibilityChanged($event)"
    >
    </cm-table>
  </ng-container>
</app-details>
