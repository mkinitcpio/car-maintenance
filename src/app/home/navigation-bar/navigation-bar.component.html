<section class="navigation-bar">
  <nav class="navigation-bar__navigation">
    <nav class="navigation-bar__modules-routes">
      @for (button of navigationButtons; track button) {
        <a
          class="navigation-bar__button-container"
          [routerLink]="'/' + button.route"
          routerLinkActive="navigation-bar__button-container--selected"
          >
          <button
            cm-button
            variant="transparent"
            [matTooltip]="button.tooltipText | translate"
            matTooltipPosition="right"
            matTooltipShowDelay="500"
          >
            <mat-icon class="navigation-bar__button-icon" [svgIcon]="button.icon"/>
          </button>
        </a>
      }
    </nav>

    <div class="navigation-bar__divider"></div>

    @if (!AppConfig.production) {
      <div class="navigation-bar__dev-buttons">
        <button
          cm-button
          variant="transparent"
          (click)="onRefreshApp()"
        >
          <mat-icon svgIcon="refresh"/>
        </button>
        <button
          cm-button
          variant="transparent"
          (click)="onOpenDevTools()"
        >
          <mat-icon svgIcon="terminal"/>
        </button>
      </div>
    }

    @if (false) {
      <button
        cm-button
        variant="transparent"
        (click)="onOpenAccount()"
      >
        <mat-icon svgIcon="user"/>
      </button>
    }

    <button
      cm-button
      variant="transparent"
      (click)="openSettings()"
    >
      <mat-icon svgIcon="settings"/>
    </button>
  </nav>
</section>
