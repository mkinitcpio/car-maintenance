<div class="currency">
  <span [style.color]="ignoreFontColor() ? 'black' : 'unset'" class="currency__value">{{value() | numberSeparator:locale()}}</span>
  @if (renderAs() === CurrencyRenderEnum.Svg) {
    <mat-icon
      class="currency__icon"
      [class.currency__icon--small]="size() === CurrencySizeEnum.Small"
      [svgIcon]="'currencies:' + (currency() | currency)">
    </mat-icon>
  } @else {
    <img class="currency__image" [src]="currencyBase64SafeUrl">
  }
</div>
