<section class="table-panel">
  @if (selectedRowsCount()) {
    <div class="table-panel__selection">
      <button cm-button size="small" variant="transparent" shape="rounded" button-transparent (click)="move.emit()">
        <mat-icon>compare_arrows</mat-icon>
      </button>
      <button cm-button size="small" variant="transparent" shape="rounded" button-transparent (click)="delete.emit()">
        <mat-icon class="table-panel__selection-delete" svgIcon="trash"></mat-icon>
      </button>
      @if (hasData()) {
        <mat-divider vertical="true"></mat-divider>
      }
    </div>
  }
  <button cm-button cm-button size="small" variant="transparent" shape="rounded" (click)="add.emit()">
    <mat-icon>add</mat-icon>
  </button>
  @if (hasData()) {
    <button cm-button cm-button size="small" variant="transparent" shape="rounded" [matMenuTriggerFor]="contextMenu">
      <mat-icon>file_download</mat-icon>
    </button>
  }
  @if (hasData()) {
    <mat-divider vertical="true"></mat-divider>
  }
  @if (hasData()) {
    <cm-column-selector [columnConfigs]="columnSchemas()" (onVisibilityChanged)="onVisibilityChanged.emit($event)">
    </cm-column-selector>
  }
</section>

<mat-menu #contextMenu="matMenu">
  <ng-template matMenuContent>
    <div cmTextHeader="h4" class="mat-menu-content__header">{{"MENU.TITLE.EXPORT" | translate}}</div>
    <button class="menu-item"
      mat-menu-item
      (click)="exportToPDF.emit()">
      <mat-icon svgIcon="printer"></mat-icon>
      <span cmTextBody="b1">PDF</span>
    </button>
    <button class="menu-item"
      (click)="exportToCSV.emit()"
      mat-menu-item>
      <mat-icon svgIcon="csv"></mat-icon>
      <span cmTextBody="b1">CSV</span>
    </button>
  </ng-template>
</mat-menu>
