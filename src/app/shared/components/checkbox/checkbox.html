<div class="checkbox">
  <input
  class="checkbox__checkbox"
  type="checkbox"
  [checked]="valueState()"
  [disabled]="disabledState()"
  (click)="onClick()"
  (change)="$event.stopPropagation()"
>
  @if(!withoutLabel()) {
    <label cmTextBody="b1" class="checkbox__description">
      <ng-content></ng-content>
    </label>
  }

</div>
