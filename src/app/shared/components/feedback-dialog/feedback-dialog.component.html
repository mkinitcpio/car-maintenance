<app-dialog class="feedback"
  [title]="data.type === FeedbackTypeEnum.Question ? 'DIALOG.FEEDBACK.QUESTION_TITLE' : 'DIALOG.FEEDBACK.TITLE'"
  [submitText]="'DIALOG.BUTTONS.SEND'"
  (submit)="onSend()"
  (close)="dialogRef.close()"
  >
  <form content [formGroup]="feedbackForm">
    <div>
      <div cmTextBody="b1" class="form-field__title">
        {{"DIALOG.FIELDS.TYPE" | translate}}
      </div>
      @if (!data.type) {
        <mat-form-field [floatLabel]="'always'">
          <mat-select panelClass="cm-select" [formControlName]="'type'">
            @for (option of feedbackTypeOptions; track option) {
              <mat-option [value]="option.key">
                {{option.value | translate}}
              </mat-option>
            }
          </mat-select>
          <mat-icon svgIcon="expand" class="mat-select__expand-icon"></mat-icon>
        </mat-form-field>
      }
    </div>

    <div>
      <div cmTextBody="b1" class="form-field__title">
        {{'Email' | translate}}
      </div>
      <cm-input
        formControlName="email"
        placeholder="email@example.com"
        [invalid]="feedbackForm.get('email').touched && feedbackForm.get('email').hasError('pattern')"
        [hint]="feedbackForm.get('email').touched && feedbackForm.get('email').hasError('pattern') ? ('DIALOG.VALIDATIONS.EMAIL' | translate) : ''">
      </cm-input>
    </div>

    <div>
      <div cmTextBody="b1" class="form-field__title">
        {{"DIALOG.FIELDS.TEXT" | translate}}
      </div>
      <cm-input
        cdkFocusInitial
        [multiline]="true"
        [rows]="6"
        formControlName="message"
        [invalid]="feedbackForm.get('message').touched && feedbackForm.get('message').hasError('required')"
        [hint]="feedbackForm.get('message').touched && feedbackForm.get('message').hasError('required') ? ('DIALOG.VALIDATIONS.TEXT' | translate) : ''">
      </cm-input>
    </div>
  </form>
</app-dialog>
