<div class="create-car-dialog">
  <app-dialog [title]="title | async"
    [mode]="data.mode"
    [reduceSpace]="true"
    (close)="onClose()"
    (submit)="onSubmit()"
    >
    <form content [formGroup]="carForm" class="create-car-dialog__content">
      <cm-accordion [expand]="true" variant="default" [header]="'DIALOG.COMMON' | translate">
        <div class="create-car-dialog__field">
          <cm-input
            cdkFocusInitial
            [label]="'DIALOG.FIELDS.NAME' | translate"
            [formControlName]="'name'"
            [hint]="getErrorMessage('name') | translate"
            [invalid]="isInvalid('name')"
          />
        </div>
        <div class="create-car-dialog__field">
          <cm-input
            [label]="'DIALOG.FIELDS.VEHICLE_ID' | translate"
            [formControlName]="'vehicleId'"
          />
        </div>
        <div class="create-car-dialog__field">
          <cm-input
            [label]="'DIALOG.FIELDS.MAKE' | translate"
            [formControlName]="'make'"
          />
        </div>
        <div class="create-car-dialog__field">
          <cm-input
            [label]="'DIALOG.FIELDS.MODEL' | translate"
            [formControlName]="'model'"
          />
        </div>
        <div class="create-car-dialog__field">
          <cm-input
            [label]="'DIALOG.FIELDS.YEAR' | translate"
            [formControlName]="'year'"
            [hint]="getErrorMessage('year') | translate"
            [invalid]="isInvalid('year')"
          />
        </div>
        <div class="create-car-dialog__field">
          <cm-input
            [label]="'DIALOG.FIELDS.ENGINE' | translate"
            [formControlName]="'engine'"
          />
        </div>
        <div class="create-car-dialog__field">
          <cm-input
            [label]="'DIALOG.FIELDS.MILEAGE' | translate"
            [formControlName]="'mileage'"
            [hint]="getErrorMessage('mileage') | translate"
            [invalid]="isInvalid('mileage')"
          />
        </div>
      </cm-accordion>

      <cm-accordion
        variant="default"
        [header]="'DIALOG.PARTS' | translate"
      >
          <div control-left class="create-car-dialog__badge-container">
            <cm-badge [label]="parts.length || '0'"/>
          </div>
          <button control-right type="button" cm-button variant="transparent" size="small" button-transparent (click)="addPart()">
            <mat-icon>add</mat-icon>
          </button>

          <div content formArrayName="parts">
            <div class="create-car-dialog__parts-inputs-container">
              @for (partConrol of parts.controls; track partConrol; let i = $index) {
                <div class="create-car-dialog__part">
                  <cm-input
                    #partInput
                    class="create-car-dialog__part-input"
                    [formControlName]="i"
                    [hint]="getPartErrorMessage(i) | translate"
                    [invalid]="isPartInvalid(i)"
                  />
                  <button type="button" cm-button variant="transparent" class="create-car-dialog__delete-button" button-transparent (click)="onDeletePart(i)">
                    <mat-icon class="create-car-dialog__delete-button-icon">delete</mat-icon>
                  </button>
                </div>
              }
            </div>
          </div>
      </cm-accordion>
    </form>
  </app-dialog>
</div>
