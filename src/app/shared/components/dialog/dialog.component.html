<section class="dialog" [class.dialog--reduce-space]="reduceSpace()">
  <header class="dialog__header">
    @if (sideMenuButton()) {
      <button cm-button variant="transparent" (click)="sideButtonClick.emit()">
        <mat-icon svgIcon="menu"></mat-icon>
      </button>
    }
    <div class="dialog__title" cmTextHeader="h1">{{title() | translate}}</div>
    <div class="dialog__buttons">
      @if (closable()) {
        <button cm-button variant="transparent" (click)="onClose()">
          <mat-icon svgIcon="close"></mat-icon>
        </button>
      }
    </div>
  </header>
  <main class="dialog__content" (scroll)="onScroll($event)">
    <ng-content select="[content]"></ng-content>
  </main>
  @if (!hideFooter()) {
    <footer class="dialog__footer">
      <button cm-button variant="secondary" (click)="onClose()">
        {{"DIALOG.BUTTONS.CANCEL" | translate}}
      </button>
      <button [disabled]="disabledSumbitButton()" cm-button variant="primary" (click)="onSubmit()">
        {{(submitText() || (mode() === FormModeEnum.Create ? "DIALOG.BUTTONS.ADD" : "DIALOG.BUTTONS.EDIT")) | translate}}
      </button>
    </footer>
  }
</section>
