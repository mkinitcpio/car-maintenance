<div class="move-dialog">
  <app-dialog [title]="'DIALOG.MOVE.TITLE'"
    [submitText]="'DIALOG.BUTTONS.MOVE'"
    [disabledSumbitButton]="!selectedItemId"
    (close)="dialogRef.close()"
    (submit)="onSubmit()"
    >
    <section content>
      <div class="move-dialog__panel">
        <cm-input
          cdkFocusInitial
          [withClearButton]="true"
          prefix="search"
          [placeholder]="'DIALOG.MOVE.SEARCH' | translate"
          (change)="onSearchChange($event)">
        </cm-input>
      </div>

      @if(items.length === 0) {
        <div class="move-dialog__empty">
          <cm-empty-state text="DIALOG.MOVE.NO_SEARCH_RESULT">
            <cm-search-illustration cmEmptyStateIllustration></cm-search-illustration>
          </cm-empty-state>
        </div>
      } @else {
        <div class="move-dialog__list">
          @for (group of items; track group) {
            @if (group.items.length) {
              <div class="move-dialog__group">
                <span cmTextHeader="h3" class="move-dialog__group-title">{{group.group}}</span>
                @for (item of group.items; track item) {
                  @if (item.id !== data.parent) {
                    <div mat-ripple
                      class="move-dialog__group-item"
                      [class.move-dialog__group-item--selected]="item.id === selectedItemId"
                      (click)="onSelect(item.id)"
                      >
                      <mat-icon class="move-dialog__list-icon"
                        [svgIcon]="item.icon">
                      </mat-icon>
                      <span cmTextBody="b1">{{item.name}}</span>
                    </div>
                  }
                }
              </div>
            }
          }
        </div>
      }
    </section>
  </app-dialog>
</div>
