<div class="create-record">
  <app-dialog [title]="title | async"
    [mode]="data.mode"
    (submit)="onSubmit()"
    (close)="onClose()"
    >
    <form content [formGroup]="recordForm">
      <cm-input
        cdkFocusInitial
        [label]="'DIALOG.FIELDS.NAME' | translate"
        [formControlName]="'name'"
        [hint]="getErrorMessage('name') | translate"
        [invalid]="isInvalid('name')"
      />

      <cm-input
        [label]="'DIALOG.FIELDS.MILEAGE' | translate"
        [formControlName]="'mileage'"
        [hint]="getErrorMessage('mileage') | translate"
        [invalid]="isInvalid('mileage')">
        <cm-mileage cmSuffix></cm-mileage>
      </cm-input>

      <div class="create-record__flex-container">
        <div>
          <div cmTextBody="b1" class="form-field__title">{{"DIALOG.FIELDS.DATE" | translate}}</div>
          <mat-form-field class="create-record__date-picker">
            <input [formControlName]="'date'" matInput [matDatepicker]="picker">
            <mat-datepicker-toggle class="date-picker__toggle" matSuffix [for]="picker">
              <mat-icon matDatepickerToggleIcon svgIcon="calendar-edit"></mat-icon>
            </mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
            <mat-error>
              {{"DIALOG.VALIDATIONS.DATE" | translate}}
            </mat-error>
          </mat-form-field>
        </div>
        <cm-input
          [label]="'DIALOG.FIELDS.EXPENSE' | translate"
          [formControlName]="'cost'"
          [hint]="getErrorMessage('cost') | translate"
          [invalid]="isInvalid('cost')">
          <app-currency cmSuffix [currency]="$safeNavigationMigration(settingsService.units()?.currency)"></app-currency>
        </cm-input>
      </div>

      <div>
        <div cmTextBody="b1" class="form-field__title">
          {{"DIALOG.FIELDS.LABELS" | translate}}
        </div>

        <mat-form-field class="form-field__labels">
          <mat-chip-grid #labelsRef [formControlName]="'labels'">
            @for (label of recordForm.get('labels').value; track $index) {
              <mat-chip-row (removed)="removeLabel($index)">
                <span cmTextBody="b1">{{label}}</span>
                <button class="create-record__chip-remove-button" matChipRemove>
                  <mat-icon>close</mat-icon>
                </button>
              </mat-chip-row>
            }
          </mat-chip-grid>

          <input [placeholder]="'DIALOG.PLACEHOLDERS.NEW_LABEL' | translate"
            [matChipInputFor]="labelsRef"
            [(ngModel)]="currentLabel"
            [ngModelOptions]="{standalone: true}"
            [matAutocomplete]="auto"
            (matChipInputTokenEnd)="addLabel($event)"
            />

          <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectLabel($event)">
            @for (label of filteredLabels(); track label) {
              <mat-option [value]="label">
                {{label}}
              </mat-option>
            }
          </mat-autocomplete>
          <mat-hint cmTextBody="b3">{{'DIALOG.HINTS.LABELS' | translate}}</mat-hint>
        </mat-form-field>
      </div>

      <cm-input
        [label]="'DIALOG.FIELDS.COMMENT' | translate"
        [formControlName]="'notes'"
        [multiline]="true"
        [rows]="8"
      />
    </form>
  </app-dialog>
</div>
