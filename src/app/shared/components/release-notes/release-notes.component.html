<section class="release-notes">
  <app-dialog
    [title]="'Car Maintenance ' + appConfig.version"
    [hideFooter]="true"
    (close)="dialogRef.close()"
  >
    <main content class="release-notes__content">
      <div class="container">
        @for (note of releaseNotes; track $index; let isFirst = $first) {
          <cm-accordion
            [header]="note.title"
            [icon]="note.icon"
            [expand]="isFirst"
            variant="default"
          >
          <ul class="release-notes__list" (click)="onListClick($event)">
            @for (news of note.news; track $index) {
              <li cmTextBody="b1" class="release-notes__text" [innerHTML]="news"></li>
            }
          </ul>
          </cm-accordion>
        }
      </div>
    </main>
  </app-dialog>
</section>
