<section class="page" [class.page--opened-side-bar]="showSidebar" [class.page--separated]="separated()">
  <div class="page__main">
    <section class="page__title-section">
      <div class="page__title">
        <ng-content select="[buttons-left]"></ng-content>
        @if (icon()) {
          <mat-icon [svgIcon]="icon()"></mat-icon>
        }
        <span cmTextHeader="h1" class="page__title-text">{{title()}}</span>
      </div>
      <div class="page__title-buttons">
        <ng-content select="[buttons-right]"></ng-content>
        @if (withSidebar()) {
          <cm-actions-panel>
            <button cm-button variant="transparent" size="small" [active]="showSidebar" button-transparent (click)="showSidebar = !showSidebar">
              <mat-icon>view_sidebar</mat-icon>
            </button>
          </cm-actions-panel>
        }
      </div>
    </section>

    <div class="page__content">
      <ng-content select="[content]"></ng-content>
    </div>
  </div>

  @if (withSidebar()) {
    <div class="page__sidebar" [class.page__sidebar--show]="showSidebar">
      <div class="page__sidebar-container">
        <section class="page__title-section">
          <div class="page__title">
            <span cmTextHeader="h1" class="page__title-text">{{sidebarTitle()}}</span>
          </div>
        </section>
        <div class="page__content">
          <ng-content select="[sidebar-content]"></ng-content>
        </div>
      </div>
    </div>
  }
</section>
