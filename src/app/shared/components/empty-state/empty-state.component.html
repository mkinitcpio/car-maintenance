<div class="empty-state empty-state--{{ size() }}">
  <div class="empty-state__illustration">
    @if (customIllustration()) {
      <ng-content select="[cmEmptyStateIllustration]" />
    } @else {
      <cm-paper-illustration />
    }
  </div>

  @if (text()) {
    @if (size() === 'l') {
      <span cmTextHeader="h2" class="empty-state__text">{{ text() | translate }}</span>
    } @else {
      <span cmTextBody="b1:strong" class="empty-state__text">{{ text() | translate }}</span>
    }
  }
</div>
