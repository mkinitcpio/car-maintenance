<app-dialog [title]="'PAGES.PDF_EXPORT.TITLE' | translate"
  [hideFooter]="true"
  [fullscreen]="true"
  (close)="dialogRef.close()"
  >
  <section content class="print-dialog">
    <div class="print-dialog__config-section">
      <div class="print-dialog__scroll">
        <cm-accordion [expand]="true" [header]="'PAGES.PDF_EXPORT.COMMON' | translate" variant="default">
          <section class="print-dialog__common">
            <div class="print-dialog__section print-dialog__section--orientation">
              <span cmTextBody="b1">{{'PAGES.PDF_EXPORT.ORIENTATION' | translate}}</span>
              <div class="print-dialog__orientation-list">
                <div
                  class="print-dialog__orientation-item print-dialog__orientation-item--vertical"
                  [class.print-dialog__orientation-item--selected]="orientation() === 'vertical'"
                  (click)="onOrientationChange('vertical')"
                >
                  <span class="print-dialog__orientation-check"></span>
                </div>
                <div
                  class="print-dialog__orientation-item print-dialog__orientation-item--horizontal"
                  [class.print-dialog__orientation-item--selected]="orientation() === 'horizontal'"
                  (click)="onOrientationChange('horizontal')"
                >
                  <span class="print-dialog__orientation-check"></span>
                </div>
              </div>
            </div>

            <div class="print-dialog__section">
              <span cmTextBody="b1">{{'PAGES.PDF_EXPORT.SHOW_TOTAL_SUM' | translate}}</span>
              <cm-switch [value]="config().showTablesCostResult"
                (change)="toggleTotal()">
              </cm-switch>
            </div>
          </section>

        </cm-accordion>

        <cm-accordion [header]="'PAGES.PDF_EXPORT.ORDER_AND_VISIBILITY' | translate" variant="default">
          <div cdkDropList class="columns" (cdkDropListDropped)="drop($event)">
            @for (column of columns; track column.id) {
              <div class="print-dialog__column-container" cdkDrag>
                <div class="column">
                  <mat-icon class="column__drag-icon" cdkDragHandle>drag_indicator</mat-icon>
                  <span cmTextBody="b1" class="column__name">{{column.name | translate}}</span>
                  @if (column.id !== 'name') {
                    <cm-checkbox
                      [withoutLabel]="true"
                      [value]="column.visible"
                      (change)="toggleColumn(column)">
                    </cm-checkbox>
                  }
                </div>
                <mat-divider class="column__divider"></mat-divider>
              </div>
            }
          </div>
        </cm-accordion>
      </div>

      <div class="print-dialog__buttons">
        <button cm-button variant="secondary" (click)="dialogRef.close()">
          {{'DIALOG.BUTTONS.CANCEL' | translate}}
        </button>
        <button cm-button (click)="onPrint()">
          {{'DIALOG.BUTTONS.EXPORT' | translate}}
        </button>
      </div>
    </div>

    <div class="print-dialog__preview-section">
      <div class="print-dialog__preview">
        <app-preview-page #print
          [config]="config()"
          [data]="data">
        </app-preview-page>
      </div>
    </div>
  </section>
</app-dialog>
