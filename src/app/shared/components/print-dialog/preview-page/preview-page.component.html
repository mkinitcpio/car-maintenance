<div class="preview-page">
  <div #viewer class="preview-page__viewer"></div>

  @if (isLoading()) {
    <div class="preview-page__loader">
      <span class="preview-page__spinner"></span>
    </div>
  }

  @if (hasError()) {
    <div class="preview-page__error">
      <mat-icon>error</mat-icon>
      @if (errorMessage()) {
        <span class="preview-page__error-text">{{ errorMessage() }}</span>
      }
    </div>
  }

  <div class="preview-page__toolbar">
    <button type="button"
      cm-button
      size="small"
      variant="transparent"
      class="preview-page__tool"
      [disabled]="isLoading() || hasError() || zoom() <= 0.5"
      (click)="zoomOut()">
      <mat-icon>zoom_out</mat-icon>
    </button>
    <button type="button"
      cm-button
      size="small"
      variant="transparent"
      class="preview-page__tool preview-page__tool--label"
      [disabled]="isLoading() || hasError()"
      (click)="resetZoom()">
      {{ zoomPercent() }}%
    </button>
    <button type="button"
      cm-button
      size="small"
      variant="transparent"
      class="preview-page__tool"
      [disabled]="isLoading() || hasError() || zoom() >= 2.5"
      (click)="zoomIn()">
      <mat-icon>zoom_in</mat-icon>
    </button>
    <button type="button"
      cm-button
      size="small"
      variant="transparent"
      class="preview-page__tool"
      [disabled]="isLoading() || hasError()"
      (click)="print()">
      <mat-icon>print</mat-icon>
    </button>
  </div>
</div>
