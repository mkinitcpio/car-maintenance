<div class="ubuntu-container">
  @if (title()) {
    <header class="ubuntu-container__header">
      <span cmTextHeader="h3">
        {{title()}}
      </span>

      @if (info()) {
        <mat-icon
          class="ubuntu-container__info"
          [matTooltip]="info()"
        >
          info
        </mat-icon>
      }

      <div class="ubuntu-container__actions">
        <ng-content select="[actions]"></ng-content>
      </div>
      <div>
        <button cm-button variant="transparent" (click)="toggle()">
          <mat-icon
            class="ubuntu-container__expand-button"
            [class.ubuntu-container__expand-button--expanded]="expandContent()"
            svgIcon="expand"
          >
          </mat-icon>
        </button>
      </div>
    </header>
  }

  <div
    class="ubuntu-container__collapsible"
    [class.ubuntu-container__collapsible--collapsed]="!expandContent()"
  >
    <main class="ubuntu-container__content">
      <ng-content></ng-content>
    </main>
  </div>

</div>
