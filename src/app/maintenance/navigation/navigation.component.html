<div class="navigation-header">
  <cm-navigation-panel
    class="navigation-header__panel"
    [class.navigation-header__panel--hidden]="searchOpen()"
    [navigationIndex]="selectedTabIndex"
    (navigationChange)="onSelectTab($event)"
  >
    <ng-container actions>
      <button
        cm-button
        size="small"
        variant="transparent"
        [attr.aria-label]="'SEARCH' | translate"
        (click)="openSearch()"
      >
        <mat-icon>search</mat-icon>
      </button>

      <button
        cm-button
        size="small"
        [active]="menu.menuOpen"
        variant="transparent"
        [matMenuTriggerFor]="addMenu"
        #menu="matMenuTrigger"
      >
        <mat-icon>add</mat-icon>
      </button>
    </ng-container>
  </cm-navigation-panel>

  <div
    class="navigation-header__search"
    [class.navigation-header__search--visible]="searchOpen()"
  >
    <cm-actions-panel class="navigation-header__search-container" [withPaddings]="false">
      <cm-input
        #searchInput
        class="navigation-header__search-field"
        background="primary"
        [withClearButton]="true"
        [withHint]="false"
        prefix="search"
        [placeholder]="'SEARCH' | translate"
        [value]="searchQuery()"
        (valueChange)="onSearchChange($event)">
      </cm-input>
    </cm-actions-panel>

    <cm-actions-panel class="navigation-header__search-action">
      <button cm-button size="small" variant="transparent" (click)="closeSearch()">
        <mat-icon>close</mat-icon>
      </button>
    </cm-actions-panel>

  </div>
</div>

<div class="navigation">
  @if (searchOpen() && searchQuery().trim() && !hasSearchResults()) {
    <div class="navigation__empty">
      <cm-empty-state text="PAGES.NAVIGATION.NO_SEARCH_RESULT">
        <cm-search-illustration cmEmptyStateIllustration></cm-search-illustration>
      </cm-empty-state>
    </div>
  } @else {
    <app-tabs
      [tabs]="tabs"
      [index]="selectedTabIndex"
      (selectedTabIndex)="onSelectTab($event)"
    >
      <app-categories-tree
        tab-1
        [catagories]="fitlerCategoriesByType(filteredCategories(), CategoryTypeEnum.Category)"
        [searchQuery]="searchQuery()"
        (add)="addCategory($event)"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"
      />

      <app-categories-tree
        tab-2
        [catagories]="fitlerCategoriesByType(filteredCategories(), CategoryTypeEnum.Car)"
        [searchQuery]="searchQuery()"
        (add)="addCategory($event)"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"
      />
    </app-tabs>
  }
</div>

<mat-menu #addMenu>
  <ng-template matMenuContent>
    <button class="menu-item" mat-menu-item (click)="onAdd(0)">
      <mat-icon class="mat-item__icon" svgIcon="tree"/>
      <span cmTextBody="b1">{{"MENU.CATEGORY" | translate}}</span>
    </button>
    <button class="menu-item" mat-menu-item (click)="onAdd(1)">
      <mat-icon class="mat-item__icon" svgIcon="illustrations:car"></mat-icon>
      <span cmTextBody="b1">{{"MENU.CAR" | translate}}</span>
    </button>
  </ng-template>
</mat-menu>
